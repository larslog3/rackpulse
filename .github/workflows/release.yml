name: Build Container & Linux Packages (.deb / .rpm / .apk / Arch)

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install GoReleaser nFPM
        uses: goreleaser/nfpm-action@v2

      - name: Package for Debian/Ubuntu (.deb), RHEL/Fedora (.rpm), Alpine (.apk), and Arch
        run: |
          mkdir -p dist
          nfpm package --config .nfpm.yaml --packager deb --target dist/
          nfpm package --config .nfpm.yaml --packager rpm --target dist/
          nfpm package --config .nfpm.yaml --packager apk --target dist/
          nfpm package --config .nfpm.yaml --packager archlinux --target dist/
          ls -lh dist/

      - name: Upload Linux packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-distro-packages
          path: dist/*

      - name: Publish GitHub Release with attached Linux packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
